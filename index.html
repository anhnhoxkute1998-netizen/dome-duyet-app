<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duyệt DOME</title>
  <meta name="theme-color" content="#4A6741">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- iOS mở từ màn hình chính dạng app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duyệt DOME">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #4A6741; }
    /* Chừa vùng an toàn tai thỏ/Dynamic Island (máy không có thì = 0) — nội dung không chui dưới đồng hồ */
    body { padding-top: env(safe-area-inset-top); }
    iframe {
      border: 0; width: 100%; display: block;
      height: 100vh;
      height: calc(100dvh - env(safe-area-inset-top));
    }
    .fallback {
      display: none; color: #F2D3BE; text-align: center; padding: 48px 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
    }
    .fallback a { color: #fff; font-weight: 700; word-break: break-all; }
    /* Màn hình chờ — hiện NGAY khi mở app, ẩn khi trang duyệt tải xong (Apps Script mất vài giây) */
    .splash {
      position: fixed; inset: 0; background: #4A6741; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .35s; line-height: 1.5;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .splash .logo { color: #F2D3BE; font-weight: 800; font-size: 40px; letter-spacing: 4px; }
    .splash .sub { color: #F2D3BE; opacity: .85; font-size: 15px; }
    .splash .spin {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(242, 211, 190, .3); border-top-color: #F2D3BE;
      animation: quay .9s linear infinite;
    }
    @keyframes quay { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="logo">DOME</div>
    <div class="spin"></div>
    <div class="sub">Đang mở trang duyệt...</div>
  </div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbw3vn-lFN_lRWLkekLEEgguCi19xtsb-96nFIwMO_slqm9Pyj3dId6RZOlTD16wJudD/exec?duyet=1"
          title="Duyệt chấm công DOME" allow="clipboard-write"></iframe>
  <div class="fallback" id="fb">
    Mạng đang chậm, chưa tải được trang duyệt.
    <br><br>
    <button type="button" onclick="thuLai()"
      style="min-height:48px;padding:0 28px;border:none;border-radius:12px;background:#F2D3BE;color:#4A6741;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer">
      Thử lại
    </button>
    <br><br>
    <a href="https://script.google.com/macros/s/AKfycbw3vn-lFN_lRWLkekLEEgguCi19xtsb-96nFIwMO_slqm9Pyj3dId6RZOlTD16wJudD/exec?duyet=1">Hoặc mở trang duyệt trực tiếp</a>
  </div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    // Trang duyệt tải xong → ẩn màn hình chờ. Mạng chậm quá 30s → fallback có nút Thử lại
    // (trang về trễ sau đó vẫn tự phục hồi màn hình app).
    var elApp = document.getElementById('app');
    var elFb = document.getElementById('fb');
    var elSplash = document.getElementById('splash');
    var loaded = false, timer = null;
    elApp.addEventListener('load', function () {
      loaded = true;
      elSplash.className = 'splash hide';
      elApp.style.display = 'block';
      elFb.style.display = 'none';
    });
    function henGioFallback() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () {
        if (!loaded) {
          elSplash.className = 'splash hide';
          elApp.style.display = 'none';
          elFb.style.display = 'block';
        }
      }, 30000);
    }
    function thuLai() {
      loaded = false;
      elFb.style.display = 'none';
      elApp.style.display = 'block';
      elSplash.className = 'splash';
      elApp.src = elApp.src; // nạp lại trang duyệt tại chỗ, khỏi đóng mở app
      henGioFallback();
    }
    henGioFallback();
  </script>
</body>
</html>
